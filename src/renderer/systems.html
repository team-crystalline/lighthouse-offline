<!DOCTYPE html>
<html lang="en">

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="./style.css" type="text/css">
    <title>Lighthouse</title>
  </head>
  <body id="systems-page">
  <nav id="top-bar">
    <a href="./index.html">Home</a>
    <a href="./alters.html">Alters</a>
    <a href="./systems.html" class="active-btn">Systems</a>

    <main>
      <h1>Systems</h1>
      <section>
        <article id="toolbar">
          <button id="system-create">Create New System</button>
        </article>
        <article id="system-list">

        </article>
      </section>
    </main>

    <dialog id="system-modal">
    <form method="dialog">
      <h2>Create New System</h2>
      <label for="sys-name-input">Name: </label>
      <input type="text" placeholder="System Name" min="1" id="sys-name-input"/>
      <label for="sys-desc-input">Description: </label>
      <input type="text" placeholder="A short description" min="1" id="sys-desc-input"/>
      <label for="sys-tags-input">Tags: </label>
      <input type="text" placeholder="Some tags (separated by commas)" min="1" id="sys-tags-input"/>
      <div class="button-group">
        <button type="submit" id="close-create">Cancel</button>
        <button type="submit" value="confirm" id="create-system">Create</button>
      </div>
    </form>
  </dialog>
    <script src="./renderer.js"></script>
  </body>
</html>
